<div class="portal-shell">
  <header class="portal-header">
    <div class="portal-container portal-header__main">
      <a class="portal-brand" routerLink="/">
        <span class="portal-brand__copy">
          <span class="portal-brand__title">Process Portal</span>
          <span class="portal-brand__subtitle">Process Management System</span>
        </span>
      </a>

      <div class="portal-header__actions">
        <app-catalog-search mode="popover" triggerLabel="Search"></app-catalog-search>
      </div>
    </div>
  </header>

  <div class="portal-nav-band">
    <div class="portal-container portal-nav-band__inner">
      <nav class="portal-nav" aria-label="Main navigation">
        @for (item of navigationItems; track item.link) {
          <a
            class="portal-nav__link"
            [routerLink]="item.link"
            [class.active-link]="isNavigationItemActive(item)"
            [attr.aria-current]="isNavigationItemActive(item) ? 'page' : null"
          >
            {{ item.label }}
          </a>
        }
      </nav>
    </div>
  </div>

  <main class="portal-main" id="main-content">
    <div class="portal-container portal-main__inner">
      <router-outlet />
    </div>
  </main>

  <footer class="portal-footer">
    <div class="portal-container portal-footer__inner">
      <div>
        <p class="portal-footer__copyright">
          &copy; {{ currentYear }} Process Portal - Process Management System
        </p>
        <p class="portal-footer__subtitle">Public process consultation platform</p>
      </div>
    </div>
  </footer>
</div>
